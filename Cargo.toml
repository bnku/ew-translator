[package]
name = "ew-translator"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0"
description = """
Fast popup translator for X11, Wayland, Windows, and macOS.

Translate text from everywhere!
Select text in any application, press hotkey and receive translation in a pop-up window.
Supports Google Translate, Gemini, OpenRouter, OpenAI, and OpenAI-compatible APIs.
"""
repository = "https://github.com/bnku/ew-translator"
keywords = ["translate", "translator"]
readme = "README.md"
authors = ["bnku <github.com/bnku>"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
notify-rust = "4"
clap = { version = "3.1.6", features = ["derive"] }
global-hotkey = "0.4.0"
mouse_position = "0.1.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.8.6", default-features = false, features = ["parse"] }
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
