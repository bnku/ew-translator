[package]
name = "ew-translator"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0"
description = """

Fast popup translator for X11.

Translate text from everywhere!
Select text in some application, press hotkey and receive translation to pop-up window.
Supports Google Translate, Gemini, OpenRouter, OpenAI, and OpenAI-compatible APIs.
"""
repository = "https://github.com/bnku/ew-translator"
keywords = ["translate", "translator"]
readme = "README.md"
authors = ["bnku <github.com/bnku>"]

[build-dependencies]
tauri-build = { version = "1.5.6", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
notify-rust = "4"
clap = { version = "3.1.6", features = ["derive"] }
global-hotkey = "0.4.0"
mouse_position = "0.1.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.8.6", default-features = false, features = ["parse"] }
tauri = { version = "1.8.3", features = [ "window-show", "window-hide", "window-set-focus", "window-set-size", "global-shortcut-all"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.15"

[profile.release]
opt-level = "z" 
lto = true
strip = "symbols"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

# compress binary:
# upx --best --lzma target/release/translator
